name: Test Environment CI/CD

on:
  push:
    branches: [test, dev, f_upgrade]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'npm'
          cache-dependency-path: ruoyi-fastapi-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ruoyi-fastapi-frontend
        run: npm install --registry=https://registry.npmmirror.com --frozen-lockfile

      - name: Build frontend
        working-directory: ruoyi-fastapi-frontend
        run: npm run build:prod
        env:
          NODE_OPTIONS: --max-old-space-size=8096

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ruoyi-fastapi-frontend/dist

  app:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'pnpm'
          cache-dependency-path: ruoyi-fastapi-app/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: ruoyi-fastapi-app
        run: pnpm install --frozen-lockfile

      - name: Build app-h5
        working-directory: ruoyi-fastapi-app
        run: pnpm run build:h5
        env:
          NODE_OPTIONS: --max-old-space-size=8096

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-h5
          path: ruoyi-fastapi-app/dist/build/h5

  backend:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: ruoyi-fastapi-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render .env.prod from template
        run: |
          envsubst '${DB_TYPE} ${DB_HOST} ${DB_PORT} ${DB_USERNAME} ${DB_PASSWORD} ${DB_DATABASE} ${REDIS_HOST} ${REDIS_PORT} ${REDIS_USERNAME} ${REDIS_PASSWORD} ${REDIS_DATABASE}' \
            < .env.prod.template > .env.prod
          echo ".env.prod rendered successfully"
        env:
          DB_TYPE: ${{ vars.DB_TYPE }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_USERNAME: ${{ vars.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DATABASE: ${{ vars.REDIS_DATABASE }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: ruoyi-fastapi-backend

  deploy:
    needs: [frontend, app, backend]
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: deploy

      - name: List artifact structure
        run: find deploy -maxdepth 4 -type d | head -30

      - name: Deploy frontend-web to test server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: deploy/frontend-dist/ruoyi-fastapi-frontend/dist
          TARGET: ${{ vars.TARGET }}/frontend/web

      - name: Deploy frontend-app to test server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: deploy/app-h5/ruoyi-fastapi-app/dist/build/h5
          TARGET: ${{ vars.TARGET }}/frontend/app

      - name: Deploy backend to test server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: deploy/backend/ruoyi-fastapi-backend
          TARGET: ${{ vars.TARGET }}/backend/ruoyi

      - name: Restart backend service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            #!/bin/bash
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            cd ${{ vars.TARGET }}/backend/ruoyi/

            echo "========== 虚拟环境检查与修复 =========="
            if ! .venv/bin/python --version &>/dev/null; then
              echo "⚠️ 虚拟环境损坏，重建中..."
              uv python install 3.12 2>/dev/null || true
              rm -rf .venv
              uv venv --python 3.12
            fi
            echo "✅ Python: $(.venv/bin/python --version)"

            echo " ========== 安装核心依赖 =========="
            uv pip install -r requirements.txt

            echo " ========== 安装 AI 插件依赖 =========="
            uv pip install \
              agno==2.8.6 \
              anthropic==0.120.2 \
              cerebras-cloud-sdk==1.91.0 \
              cohere==7.0.8 \
              google-genai==2.16.0 \
              groq==1.6.0 \
              litellm==1.94.0 \
              llama-api-client==0.6.0 \
              mistralai==2.8.0 \
              ollama==0.6.2 \
              openai==2.52.0 \
              portkey-ai==2.3.4

            echo " ========== 提取端口,杀进程,Supervisor 自动重启 =========="
            PORT=$(grep -E '^APP_PORT\s*=' .env.prod | head -1 | sed 's/.*=\s*//')
            PORT=${PORT:-9099}
            fuser -k ${PORT}/tcp 2>/dev/null || true

            # ========== 重启服务,可用提取端口,杀进程,Supervisor 自动重启替代 ==========
            # /www/server/panel/pyenv/bin/supervisorctl restart fastapiadmin

            echo " ========== 健康检查 =========="
            echo "Waiting for health check on port ${PORT}..."
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PORT}/api/v1/common/health/live" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Deployment successful (HTTP 200) after ${i}s"
                exit 0
              fi
              sleep 1
            done

            echo "❌ Health check failed after 30s"
            exit 1
