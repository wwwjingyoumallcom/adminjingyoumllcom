name: Test Environment CI/CD

on:
  push:
    branches: [test, dev, f_upgrade]
  workflow_dispatch:

jobs:
  frontend_build_deploy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: ruoyi-fastapi-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'

      - name: Install frontend dependencies
        working-directory: ruoyi-fastapi-frontend
        run: npm ci --registry=https://registry.npmmirror.com
      - name: Build frontend
        working-directory: ruoyi-fastapi-frontend
        run: npm run build:prod
        env:
          NODE_OPTIONS: --max-old-space-size=8096
      
      - name: Deploy web to ${{ vars.WEB_TARGET }}
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzv --delete"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          SOURCE: ruoyi-fastapi-frontend/dist/
          TARGET: ${{ vars.WEB_TARGET }}

  app_build_deploy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: ruoyi-fastapi-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ruoyi-fastapi-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install app dependencies
        working-directory: ruoyi-fastapi-app
        run: pnpm install

      - name: Build app-h5
        working-directory: ruoyi-fastapi-app
        run: pnpm run build:h5
        env:
          NODE_OPTIONS: --max-old-space-size=8096

      - name: Deploy h5 to ${{ vars.H5_TARGET }}
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzv --delete"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          SOURCE: ruoyi-fastapi-app/dist/build/h5/
          TARGET: ${{ vars.H5_TARGET }}


  backend_build_deploy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: ruoyi-fastapi-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render .env.prod from template
        run: |
          envsubst '${DB_TYPE} ${DB_HOST} ${DB_PORT} ${DB_USERNAME} ${DB_PASSWORD} ${DB_DATABASE} ${REDIS_HOST} ${REDIS_PORT} ${REDIS_USERNAME} ${REDIS_PASSWORD} ${REDIS_DATABASE}' \
            < .env.prod.template > .env.prod
          echo ".env.prod rendered successfully"
        env:
          DB_TYPE: ${{ vars.DB_TYPE }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_USERNAME: ${{ vars.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DATABASE: ${{ vars.REDIS_DATABASE }}

      - name: Deploy backend to ${{ vars.BACKEND_TARGET }}
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzv --delete --exclude=.venv"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          SOURCE: ruoyi-fastapi-backend/
          TARGET: ${{ vars.BACKEND_TARGET }}

      - name: Restart backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            #!/bin/bash
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            cd ${{ vars.BACKEND_TARGET }}

            echo "========== 虚拟环境检查与修复 =========="
            if ! .venv/bin/python --version &>/dev/null; then
              echo "⚠️ 虚拟环境损坏，重建中..."
              uv python install 3.12 2>/dev/null || true
              rm -rf .venv
              uv venv --python 3.12
            fi
            echo "✅ Python: $(.venv/bin/python --version)"

            echo " ========== 安装核心依赖 =========="
            uv pip install -r requirements.txt

            echo " ========== 安装 AI 插件依赖 =========="
            uv pip install \
              agno==2.8.6 \
              anthropic==0.120.2 \
              cerebras-cloud-sdk==1.91.0 \
              cohere==7.0.8 \
              google-genai==2.16.0 \
              groq==1.6.0 \
              litellm==1.94.0 \
              llama-api-client==0.6.0 \
              mistralai==2.8.0 \
              ollama==0.6.2 \
              openai==2.52.0 \
              portkey-ai==2.3.4

            echo " ========== 重启服务 =========="
            PORT=$(grep -E '^APP_PORT\s*=' .env.prod | head -1 | sed 's/.*=\s*//')
            PORT=${PORT:-9099}

            # 通过 Supervisor 重启（如果已配置）
            if command -v supervisorctl &>/dev/null && supervisorctl status ruoyifastapi &>/dev/null; then
              echo "通过 Supervisor 重启服务..."
              supervisorctl restart ruoyifastapi
            else
              echo "Supervisor 未配置，手动重启..."
              fuser -k ${PORT}/tcp 2>/dev/null || true
              sleep 1
              nohup .venv/bin/python app.py --env prod > /tmp/ruoyi-app.log 2>&1 &
              echo "服务已启动，PID: $!"
            fi

            echo " ========== 健康检查 =========="
            echo "Waiting for health check on port ${PORT}..."
            for i in $(seq 1 30); do
              # 检查端口是否响应（任何 HTTP 状态码都说明服务已启动）
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PORT}/" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" != "000" ]; then
                echo "✅ Deployment successful (HTTP ${HTTP_CODE}) after ${i}s"
                exit 0
              fi
              sleep 1
            done

            echo "❌ Health check failed after 30s"
            echo "========== 最近日志 =========="
            tail -20 /tmp/ruoyi-app.log 2>/dev/null || true
            exit 1
